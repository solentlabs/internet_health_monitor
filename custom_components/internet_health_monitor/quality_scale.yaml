# Self-assessment against the Home Assistant Integration Quality Scale.
# Format and rule set follow HA core's hassfest (script/hassfest/quality_scale.py).
# HA grades only core integrations; this file is not reviewed by HA.
# done = meets the rule as written; exempt = the rule's own exception applies;
# todo = not met, including deliberate deviations (the comment says which).
rules:
  # Bronze
  action-setup:
    status: done
    comment: "generate_dashboard_card is registered in async_setup (services.py async_setup_services), so it exists before any entry loads; it raises a translated ServiceValidationError when no entry exists (tests/components/test_dashboard.py)."
  appropriate-polling:
    status: done
    comment: "Fixed 60 s from Core timing.POLL_INTERVAL_S (coordinator.py), chosen against comparable tools in ADR-007; not a form field; README.md Polling shows the automation route. Speed tests never poll: update_interval None, run only by the Run speed test button (README.md Speed Testing shows the automation)."
  brands:
    status: done
    comment: brand/icon.png, icon.svg, logo.png and dark variants in the integration directory.
  common-modules:
    status: done
    comment: entity.py InternetHealthEntity holds unique id and device; coordinator.py holds InternetHealthCoordinator and the typed entry.
  config-flow:
    status: done
    comment: "config_flow.py: selectors for every field, data_description for every field in strings.json and all translations; one build_schema for setup and options."
  config-flow-test-coverage:
    status: done
    comment: "config_flow.py 100%; tests/components/test_config_flow.py runs the flows through HA's flow manager: created entry's unique_id, already_configured abort, options save, defaults, ping range."
  dependency-transparency:
    status: todo
    comment: "Core is MIT with .github/workflows/publish.yml (trusted publishing, version check against manifest.json), but not yet on PyPI: first publish is ROADMAP Path to Release stage 3."
  docs-actions:
    status: done
    comment: README.md Generate Dashboard Card Action; fields and descriptions in services.yaml, strings.json and all translations.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description:
    status: done
    comment: README.md introduction and Features.
  docs-installation-instructions:
    status: done
    comment: README.md Manual Installation; prerequisites in Requirements (Linux host, traceroute).
  docs-removal-instructions:
    status: done
    comment: README.md Installation > Removal.
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities subscribe to no events beyond CoordinatorEntity's own listener.
  entity-unique-id:
    status: done
    comment: Every entity sets _attr_unique_id scoped by entry_id (sensor.py, binary_sensor.py, button.py).
  has-entity-name:
    status: done
    comment: _attr_has_entity_name = True on every entity class (sensor.py, binary_sensor.py, button.py).
  runtime-data:
    status: done
    comment: entry.runtime_data is InternetHealthRuntimeData; typed InternetHealthConfigEntry (coordinator.py).
  test-before-configure:
    status: exempt
    comment: Runtime-discovery exception; the user enters no connection details, gateway, hops and system DNS are detected at runtime (core NetworkDiagnostics.run_diagnostics).
  test-before-setup:
    status: done
    comment: "__init__.py: unsupported OS or missing ip/ping raise ConfigEntryError (translated); first refresh failure raises ConfigEntryNotReady via async_config_entry_first_refresh (tests/components/test_init.py)."
  unique-config-entry:
    status: done
    comment: async_set_unique_id(DOMAIN) and _abort_if_unique_id_configured in ConfigFlow.async_step_user (config_flow.py).

  # Silver
  action-exceptions:
    status: done
    comment: Buttons raise HomeAssistantError (refresh_failed, speed_test_failed) when the poll or test they trigger fails, and ServiceValidationError (daily_limit_reached, mlab_automated_limit) when a speed test is refused (button.py, coordinator.py); generate_dashboard_card raises ServiceValidationError (not_set_up, nothing_to_show; dashboard.py).
  config-entry-unloading:
    status: done
    comment: async_unload_entry saves the usage totals and unloads platforms; timers are cancelled through entry.async_on_unload (__init__.py, coordinator.py). The options flow reloads the entry (OptionsFlowWithReload).
  docs-configuration-parameters:
    status: done
    comment: README.md Configuration and Hop Ownership cover every options-flow field (same fields as setup).
  docs-installation-parameters:
    status: done
    comment: README.md Configuration covers every setup field with default and meaning.
  entity-unavailable:
    status: done
    comment: A failed poll makes every entity unavailable (CoordinatorEntity); missing ping/ip stops setup instead of reporting off (tests/components/test_binary_sensor.py).
  integration-owner:
    status: done
    comment: manifest.json codeowners.
  log-when-unavailable:
    status: done
    comment: async_update_data raises UpdateFailed; DataUpdateCoordinator logs the first failure and the recovery once (__init__.py).
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES = 0 in sensor.py and binary_sensor.py (coordinator-driven), 1 in button.py.
  reauthentication-flow:
    status: exempt
    comment: The integration needs no authentication.
  test-coverage:
    status: done
    comment: Every integration module at 100% (make test); gates in Makefile and CI.

  # Gold
  devices:
    status: done
    comment: "One service device per entry: name, manufacturer, sw_version, entry_type SERVICE (entity.py)."
  diagnostics:
    status: done
    comment: diagnostics.py returns options, coordinator state, hop and DNS data and recent logs (log_buffer.py); redact.py removes hop hostnames and public addresses (ARCHITECTURE.md § Diagnostics); no credentials exist; 100% covered.
  discovery:
    status: exempt
    comment: Nothing to discover; IHM measures the HA host's own network path, not a device or service on the network.
  discovery-update-info:
    status: exempt
    comment: Nothing to discover (see discovery).
  docs-data-update:
    status: done
    comment: "README.md Polling: 60 s, and how to change it."
  docs-examples:
    status: done
    comment: README.md Dashboard Examples and docs/dashboard-examples.md; tests/components/test_docs.py fails if they name an entity id IHM does not create.
  docs-known-limitations:
    status: done
    comment: "README.md Known Limitations: three hops, own path only, Docker Desktop, silent routers, jitter history, fixed polling, hop ownership limits."
  docs-supported-devices:
    status: exempt
    comment: Does not integrate physical devices.
  docs-supported-functions:
    status: done
    comment: README.md Entities lists every sensor, binary sensor, button and attribute.
  docs-troubleshooting:
    status: done
    comment: "README.md Troubleshooting: missing tools, unknown hops (traceroute, Docker Desktop, silent routers), gateway not detected."
  docs-use-cases:
    status: done
    comment: README.md Features and What Makes This Different; docs/USE_CASES.md.
  dynamic-devices:
    status: exempt
    comment: One static device per config entry, tied to the entry's lifecycle.
  entity-category:
    status: done
    comment: Refresh and reset buttons, Connection type, Install type and the usage totals are DIAGNOSTIC (button.py, sensor.py); measurements, binary sensors and Run speed test are primary.
  entity-device-class:
    status: done
    comment: Latency and jitter DURATION, Connection type and Install type ENUM (sensor.py), reachability CONNECTIVITY (binary_sensor.py); packet loss % has no fitting class.
  entity-disabled-by-default:
    status: done
    comment: Reset network cache (button.py RESET_CACHE) and the six usage totals (sensor.py USAGE_SENSORS) are disabled by default.
  entity-translations:
    status: done
    comment: Every entity has a translation_key and no hard-coded name; names in strings.json and all six translations.
  exception-translations:
    status: done
    comment: update_failed, refresh_failed, unsupported_platform and missing_tools in strings.json exceptions and all translations.
  icon-translations:
    status: done
    comment: icons.json for every entity, with off-state icons for the binary sensors; no icons in code.
  reconfiguration-flow:
    status: done
    comment: "config_flow.py async_step_reconfigure: same build_schema, saves options and reloads via async_update_reload_and_abort (tests/components/test_config_flow.py)."
  repair-issues:
    status: done
    comment: "Missing traceroute raises the traceroute_missing issue (translated, learn-more link) and clears it once installed or the entry is removed (__init__.py; tests/components/test_init.py). Missing ip/ping stop setup with ConfigEntryError instead."
  stale-devices:
    status: exempt
    comment: One static device per config entry, tied to the entry's lifecycle.

  # Platinum
  async-dependency:
    status: done
    comment: Core is asyncio; probes via asyncio.create_subprocess_exec (platforms/linux.py _run), DNS via create_datagram_endpoint (dns_probe.py), speed tests via aiohttp (speed_test.py, backends/).
  inject-websession:
    status: done
    comment: Core's speed tests take the session as an argument (speed_test.run_speed_test); the integration passes HA's shared one from async_get_clientsession (coordinator.py SpeedTestCoordinator).
  strict-typing:
    status: done
    comment: "HA core's mypy settings (pyproject.toml [tool.mypy], from HA mypy.ini) pass with no errors on the minimum and newest HA (make type-check, CI); Core ships py.typed; typed InternetHealthConfigEntry used throughout; @override on every override."
