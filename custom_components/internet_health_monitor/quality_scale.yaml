# Self-assessment against the Home Assistant Integration Quality Scale.
# Format and rule set follow HA core's hassfest (script/hassfest/quality_scale.py).
# HA grades only core integrations; this file is not reviewed by HA.
# done = meets the rule as written; exempt = the rule's own exception applies;
# todo = not met, including deliberate deviations (the comment says which).
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions of its own.
  appropriate-polling:
    status: todo
    comment: Default 60 s (const.py DEFAULT_SCAN_INTERVAL), but the interval is a config-flow and options field (CONF_SCAN_INTERVAL in config_flow.py); the rule says it is not a config-flow field.
  brands:
    status: done
    comment: brand/icon.png, icon.svg, logo.png and dark variants in the integration directory.
  common-modules:
    status: todo
    comment: No entity.py. InternetHealthSensor, HopSensorBase (sensor.py), InternetHealthBinarySensor (binary_sensor.py) and InternetHealthButtonBase (button.py) each build the same device info; coordinator is a plain DataUpdateCoordinator built in __init__.py.
  config-flow:
    status: todo
    comment: data_description covers only hop_ownership; fields use bare bool/int/vol.In, no selectors (config_flow.py).
  config-flow-test-coverage:
    status: todo
    comment: config_flow.py at 100% lines, but tests patch out async_set_unique_id and _abort_if_unique_id_configured, so the entry's unique_id and the already_configured abort are never asserted (tests/components/test_config_flow.py).
  dependency-transparency:
    status: todo
    comment: Core is MIT but not on PyPI; no publish workflow (.github/workflows/release.yml only makes a GitHub release, from a stale custom_components/ha_network_diagnostics path).
  docs-actions:
    status: exempt
    comment: The integration adds no actions of its own.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description:
    status: done
    comment: README.md introduction and Features.
  docs-installation-instructions:
    status: done
    comment: README.md Manual Installation; prerequisites in Requirements (Linux host, traceroute).
  docs-removal-instructions:
    status: todo
    comment: README.md has no removal section.
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities subscribe to no events beyond CoordinatorEntity's own listener.
  entity-unique-id:
    status: done
    comment: Every entity sets _attr_unique_id scoped by entry_id (sensor.py, binary_sensor.py, button.py).
  has-entity-name:
    status: done
    comment: _attr_has_entity_name = True on every entity class (sensor.py, binary_sensor.py, button.py).
  runtime-data:
    status: todo
    comment: Coordinator, NetworkDiagnostics and flags stored in hass.data[DOMAIN][entry_id] (__init__.py); no entry.runtime_data, no typed config entry.
  test-before-configure:
    status: exempt
    comment: Runtime-discovery exception; the user enters no connection details, gateway, hops and system DNS are detected at runtime (core NetworkDiagnostics.run_diagnostics).
  test-before-setup:
    status: todo
    comment: async_config_entry_first_refresh never fails in practice; core turns missing ping/traceroute/ip into empty results (platforms/linux.py), and UnsupportedPlatformError from NetworkDiagnostics() escapes uncaught instead of ConfigEntryError (__init__.py).
  unique-config-entry:
    status: done
    comment: async_set_unique_id(DOMAIN) and _abort_if_unique_id_configured in ConfigFlow.async_step_user (config_flow.py).

  # Silver
  action-exceptions:
    status: todo
    comment: Button presses never raise; RefreshDiagnosticsButton and ResetCacheButton call coordinator.async_request_refresh, which swallows a failed refresh (button.py).
  config-entry-unloading:
    status: done
    comment: async_unload_entry unloads platforms and pops hass.data; update listener uses entry.async_on_unload (__init__.py).
  docs-configuration-parameters:
    status: done
    comment: README.md Configuration and Hop Ownership cover every options-flow field (same fields as setup).
  docs-installation-parameters:
    status: done
    comment: README.md Configuration covers every setup field with default and meaning.
  entity-unavailable:
    status: todo
    comment: A missing or failing ping binary returns (False, None) (core platforms/linux.py LinuxPlatform.ping), so Gateway Reachable reports off and hop sensors stay available instead of going unavailable.
  integration-owner:
    status: done
    comment: manifest.json codeowners.
  log-when-unavailable:
    status: done
    comment: async_update_data raises UpdateFailed; DataUpdateCoordinator logs the first failure and the recovery once (__init__.py).
  parallel-updates:
    status: todo
    comment: No PARALLEL_UPDATES in sensor.py, binary_sensor.py or button.py.
  reauthentication-flow:
    status: exempt
    comment: The integration needs no authentication.
  test-coverage:
    status: todo
    comment: Integration total above 95%, but the rule is above 95% per module; __init__.py is 90% (UpdateFailed path, lines 86-89 uncovered).

  # Gold
  devices:
    status: todo
    comment: One device per entry with name, manufacturer and model (model repeats NAME); no sw_version or entry_type=DeviceEntryType.SERVICE for a monitoring service (sensor.py, binary_sensor.py, button.py).
  diagnostics:
    status: done
    comment: diagnostics.py returns options, coordinator state, hop and DNS data; no credentials exist; hop IPs and hostnames are ISP routers, not redacted; 100% covered.
  discovery:
    status: exempt
    comment: Nothing to discover; IHM measures the HA host's own network path, not a device or service on the network.
  discovery-update-info:
    status: exempt
    comment: Nothing to discover (see discovery).
  docs-data-update:
    status: done
    comment: README.md Configuration states the 60 s default poll; Hop Ownership states ASN lookup runs once when hops are detected.
  docs-examples:
    status: todo
    comment: docs/dashboard-examples.md Automation Examples use entity ids IHM does not create (sensor.internet_health_monitor_packet_loss, _gateway_latency, _hop_2_latency); README.md does not link it.
  docs-known-limitations:
    status: todo
    comment: No limitations section; only scattered notes (README.md Requirements, Hop Ownership table).
  docs-supported-devices:
    status: exempt
    comment: Does not integrate physical devices.
  docs-supported-functions:
    status: todo
    comment: README.md Sensors lists Gateway Latency, Gateway Jitter and Packet Loss sensors that sensor.py does not create, omits per-hop jitter and packet loss, and names the Refresh button wrongly.
  docs-troubleshooting:
    status: todo
    comment: README.md Troubleshooting exists, but "Gateway not detected" tells users to configure a gateway IP, which no setting allows.
  docs-use-cases:
    status: done
    comment: README.md Features and What Makes This Different; docs/USE_CASES.md.
  dynamic-devices:
    status: exempt
    comment: One static device per config entry, tied to the entry's lifecycle.
  entity-category:
    status: done
    comment: Refresh Diagnostics is CONFIG, Reset Network Cache is DIAGNOSTIC (button.py); sensors and binary sensors are primary.
  entity-device-class:
    status: done
    comment: Latency and jitter DURATION (sensor.py), reachability CONNECTIVITY (binary_sensor.py); packet loss % has no fitting class.
  entity-disabled-by-default:
    status: todo
    comment: No entity is disabled by default; Reset Network Cache, a troubleshooting button, is a rarely used candidate.
  entity-translations:
    status: todo
    comment: Hop sensors and buttons set _attr_name, which overrides translation_key; strings.json lacks hop_N_jitter/packet_loss keys and buttons have no translation_key. DNS and binary sensors translate.
  exception-translations:
    status: todo
    comment: No exceptions block in strings.json; UpdateFailed carries a hardcoded English message (__init__.py async_update_data).
  icon-translations:
    status: todo
    comment: Icons set in code (icon= on descriptions, _attr_icon in sensor.py, button.py); no icons.json.
  reconfiguration-flow:
    status: todo
    comment: No async_step_reconfigure; every setup field is editable in OptionsFlowHandler (config_flow.py).
  repair-issues:
    status: todo
    comment: No repair issues; a missing ping or traceroute binary (user-fixable per README.md Troubleshooting) shows only as unknown sensors and a debug log.
  stale-devices:
    status: exempt
    comment: One static device per config entry, tied to the entry's lifecycle.

  # Platinum
  async-dependency:
    status: done
    comment: Core is asyncio; probes via asyncio.create_subprocess_exec (platforms/linux.py _run), DNS via create_datagram_endpoint (dns_probe.py).
  inject-websession:
    status: exempt
    comment: Core makes no HTTP requests (subprocess probes and UDP DNS).
  strict-typing:
    status: todo
    comment: Core ships py.typed, but pyproject.toml [tool.mypy] is not strict; no typed config entry; button.py uses unparameterised CoordinatorEntity and DataUpdateCoordinator.
