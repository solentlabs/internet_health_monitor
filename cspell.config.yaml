version: "0.2"
language: en

ignorePaths:
  - .git/**
  - .venv/**
  - .venv-current/**
  - htmlcov/**
  - test-ha-config/**
  - "**/__pycache__/**"
  # Localized UI strings: non-English by design
  - "**/translations/*.json"

# Fragments that are not words: struct formats, flags, example hostnames
ignoreWords:
  - atlnga # example backbone router hostname (ROADMAP.md)
  - HHIH # struct format in dns_probe.py
  - tuln # ss flags
  - tulpn # ss flags
  - ttls # list of TTLs in a test fake

