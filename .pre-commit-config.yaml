# Pre-commit hooks for Internet Health Monitor: CI's checks, caught before CI.
# Install (all three hook types below): pre-commit install
# Run manually: pre-commit run --all-files

default_install_hook_types: [pre-commit, commit-msg, pre-push]
# A hook runs at commit unless it names its stage; a push runs only its own two.
default_stages: [pre-commit]

repos:
  # Code formatting with Black
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        files: \.py$

  # Linting with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.2
    hooks:
      - id: ruff
        args: [--fix]
        files: \.py$

  # Commit message format (Conventional Commits): the rules CI's
  # commit-lint workflow enforces, from commitlint.config.js, caught at
  # commit time. Install with: pre-commit install --hook-type commit-msg
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # custom_components/ has no __init__.py; without explicit bases mypy
        # names each file twice (internet_health_monitor.* and
        # custom_components.internet_health_monitor.*) and stops.
        args:
          [
            --ignore-missing-imports,
            --explicit-package-bases,
            --follow-imports=silent,
          ]
        additional_dependencies:
          - pytest-socket
        # HA-free core only, as CMM does: this isolated env has no
        # homeassistant, so HA types would read as Any. The HA layer is
        # type-checked from a venv with HA installed (make type-check).
        files: ^packages/internet_health_monitor_core/solentlabs/.*\.py$

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^\.github/workflows/
      - id: check-json
        # JSONC files (comments allowed), as in CMM.
        exclude: (devcontainer\.json|\.vscode/.*\.json)$
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Shell script formatting
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci"]

  # YAML formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.1.0"
    hooks:
      - id: prettier
        types: [yaml]

  # Python-specific checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: debug-statements
      - id: check-ast
      - id: check-builtin-literals
      - id: check-docstring-first

  # CI's checks the hooks above leave out, run from the project's virtual environments and
  # the same commands as CI (Makefile). Each commit: the changed files'
  # spelling and Markdown, and the whole project's types when Python changed.
  # Each push: every check over the repository, then the tests on both HA
  # versions with the coverage gates.
  - repo: local
    hooks:
      - id: cspell
        name: cspell (cspell.config.yaml, as CI)
        entry: npx --yes cspell@10 --config cspell.config.yaml --no-progress --no-must-find-files
        language: system
        files: \.(py|md|ya?ml|json|toml|sh|txt)$
      - id: markdownlint
        name: markdownlint (.markdownlint.jsonc, as CI)
        entry: npx --yes markdownlint-cli2@0.24.1
        language: system
        types: [markdown]
      - id: type-check
        name: mypy, both HA versions (make type-check)
        entry: make -s type-check
        language: system
        files: \.py$
        pass_filenames: false
      - id: pyright
        name: pyright, both HA versions (make pyright)
        entry: make -s pyright
        language: system
        files: \.py$
        pass_filenames: false
      - id: check
        name: every check over the repository (make check)
        entry: make -s check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: test-all
        name: tests on both HA versions, coverage gates (make test-all)
        entry: make -s test-all
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
