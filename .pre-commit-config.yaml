# Pre-commit hooks for HA Network Diagnostics
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Code formatting with Black
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        files: \.py$

  # Linting with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.2
    hooks:
      - id: ruff
        args: [--fix]
        files: \.py$

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # custom_components/ has no __init__.py; without explicit bases mypy
        # names each file twice (internet_health_monitor.* and
        # custom_components.internet_health_monitor.*) and stops.
        args:
          [
            --ignore-missing-imports,
            --explicit-package-bases,
            --follow-imports=silent,
          ]
        additional_dependencies:
          - pytest-socket
        # HA-free core only, as CMM does: this isolated env has no
        # homeassistant, so HA types would read as Any. The HA layer is
        # type-checked from a venv with HA installed (make type-check).
        files: ^custom_components/internet_health_monitor/core/.*\.py$

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^\.github/workflows/
      - id: check-json
        # JSONC files (comments allowed), as in CMM.
        exclude: (devcontainer\.json|\.vscode/.*\.json)$
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Shell script formatting
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci"]

  # YAML formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.1.0"
    hooks:
      - id: prettier
        types: [yaml]

  # Python-specific checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: debug-statements
      - id: check-ast
      - id: check-builtin-literals
      - id: check-docstring-first
