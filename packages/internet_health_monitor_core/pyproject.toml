[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solentlabs-internet-health-monitor-core"
version = "0.1.0b1"
description = "Internet Health Monitor Core: platform-agnostic network path measurement"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]
license = "MIT"
authors = [
    { name = "Solent Labs™" },
]
keywords = ["network", "latency", "jitter", "packet-loss", "monitoring", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/solentlabs/internet_health_monitor"
Repository = "https://github.com/solentlabs/internet_health_monitor"
Issues = "https://github.com/solentlabs/internet_health_monitor/issues"
Changelog = "https://github.com/solentlabs/internet_health_monitor/blob/main/CHANGELOG.md"

[project.scripts]
internet-health-monitor = "solentlabs.internet_health_monitor_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["solentlabs"]
