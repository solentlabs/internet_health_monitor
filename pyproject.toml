# pyproject.toml
# Configuration for internet_health_monitor - Home Assistant Internet Health Monitor Integration

[project]
name = "internet-health-monitor"
version = "0.1.0"
description = "Internet health monitoring integration for Home Assistant - gateway latency, jitter, packet loss, DNS monitoring"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Solent Labs"},
    {name = "Ken Schulz"}
]
keywords = ["home-assistant", "network", "diagnostics", "monitoring", "latency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]

dependencies = []  # HA provides all runtime dependencies; dev tools: requirements-dev.txt

[project.urls]
Repository = "https://github.com/solentlabs/internet_health_monitor"
Documentation = "https://github.com/solentlabs/internet_health_monitor#readme"
Organization = "https://github.com/solentlabs"

# -------------------------------
# Black (code formatter)
# -------------------------------
[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'

# -------------------------------
# Ruff (linter + import sorter)
# -------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "__pycache__",
    ".venv", "venv",
    ".git",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "C90",          # mccabe complexity
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "SIM",          # flake8-simplify
    "TID",          # flake8-tidy-imports
    "N",            # pep8-naming
]

ignore = [
    "B008",   # Allow function calls in default args (common in HA)
    "B904",   # Allow bare `raise` for re-raising
    "SIM108", # Avoid forced ternary expressions
    "TID252", # Allow relative imports in HA custom components
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["custom_components.internet_health_monitor", "solentlabs"]
split-on-trailing-comma = true
force-wrap-aliases = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["B011", "S101"]
"packages/*/tests/**/*.py" = ["B011", "S101"]
"scripts/**/*.py" = ["T201"]

# -------------------------------
# Mypy (static type checker)
# -------------------------------
[tool.mypy]
# Home Assistant core's strict-typing settings (its mypy.ini global section
# plus the per-integration strict block; quality scale strict-typing).
python_version = "3.14"
mypy_path = "packages/internet_health_monitor_core"
files = [
    "custom_components/internet_health_monitor/**/*.py",
    "packages/internet_health_monitor_core/solentlabs/**/*.py",
]
explicit_package_bases = true
show_error_codes = true
follow_imports = "normal"
local_partial_types = true
strict_equality = true
strict_bytes = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
enable_error_code = ["deprecated", "explicit-override", "ignore-without-code", "redundant-self", "truthy-iterable"]
disable_error_code = ["annotation-unchecked", "import-not-found", "import-untyped"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unreachable = true

# -------------------------------
# Pytest (test runner)
# -------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short --cov=custom_components/internet_health_monitor --cov=solentlabs.internet_health_monitor_core --cov-report=term-missing"
testpaths = ["tests", "packages/internet_health_monitor_core/tests"]

[tool.coverage.run]
# Windows-only ctypes bindings: exercised for real by `make test-windows`;
# the Windows probes built on them are unit-tested with a fake.
omit = ["*/platforms/_iphlpapi.py"]
