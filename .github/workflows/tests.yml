name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # release.yml runs it on the tagged commit before building

jobs:
  test:
    name: HA ${{ matrix.ha }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mirrors make setup (oldest supported HA, ADR-008) and
          # make setup-current (newest HA the test harness supports).
          - ha: minimum
            constraints: "-c ha-minimum.txt"
          - ha: newest
            constraints: ""

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-ha-${{ matrix.ha }}-pip-${{ hashFiles('requirements-dev.txt', 'ha-minimum.txt') }}
          restore-keys: |
            ${{ runner.os }}-ha-${{ matrix.ha }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt ${{ matrix.constraints }}

      - name: Run linting
        run: |
          ruff check .
          black --check .

      - name: Run type checking (HA strict-typing settings, pyproject.toml)
        run: mypy

      - name: Run pyright (as VS Code runs it, pyrightconfig.json; same as make pyright)
        run: npx --yes pyright@1.1.414 --pythonpath "$(which python)"

      - name: Run markdownlint (as VS Code runs it, .markdownlint.jsonc; same as make markdownlint)
        run: git ls-files '*.md' | xargs npx --yes markdownlint-cli2@0.24.1

      - name: Run tests
        run: pytest --cov-report=xml

      - name: Coverage gates (95% HA layer, HA's threshold; 90% Core; as make test)
        run: |
          coverage report --include="custom_components/*" --fail-under=95
          coverage report --include="*/solentlabs/internet_health_monitor_core/*" --fail-under=90

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.ha == 'minimum'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  core-python-312:
    # Core (and its CLI) supports Python 3.12+, below HA's 3.14 floor.
    name: Core on Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Core and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/internet_health_monitor_core pytest pytest-asyncio pytest-cov pytest-socket

      - name: Run Core tests
        run: pytest packages/internet_health_monitor_core/tests --no-cov -p no:cacheprovider

  spell-check:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run cspell (same command as make spell-check)
        run: npx --yes cspell@10 --config cspell.config.yaml --gitignore --dot --no-progress "**/*.{py,md,yaml,yml,json,toml,sh,txt}"
