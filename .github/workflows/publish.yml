name: Publish Core to PyPI

# Publishes solentlabs-internet-health-monitor-core, which manifest.json pins
# (ADR-005). Trusted publishing: PyPI environments "pypi-core" and
# "test-pypi-core" must be set up for this repo before the first run.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Publish to Test PyPI instead"
        required: false
        default: false
        type: boolean

jobs:
  build-core:
    name: Build Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check versions agree
        # Tag (when tagged), manifest.json pin and Core's own version must match.
        run: |
          python - <<'PY'
          import json, os, sys, tomllib
          core = tomllib.load(open("packages/internet_health_monitor_core/pyproject.toml", "rb"))["project"]["version"]
          manifest = json.load(open("custom_components/internet_health_monitor/manifest.json"))
          pin = manifest["requirements"][0].split("==")[1]
          tag = os.environ.get("GITHUB_REF_NAME", "")
          problems = [f"manifest pins {pin}, Core is {core}"] if pin != core else []
          if tag.startswith("v") and tag[1:] != core:
              problems.append(f"tag {tag} does not match Core {core}")
          sys.exit("\n".join(problems) or None)
          PY

      - name: Install build tools
        run: pip install build

      - name: Build package
        working-directory: packages/internet_health_monitor_core
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-core
          path: packages/internet_health_monitor_core/dist/

  publish-core:
    name: Publish Core to PyPI
    needs: build-core
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.test_pypi != 'true'
    runs-on: ubuntu-latest
    environment: pypi-core
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-core
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-core-test:
    name: Publish Core to Test PyPI
    needs: build-core
    if: github.event.inputs.test_pypi == 'true'
    runs-on: ubuntu-latest
    environment: test-pypi-core
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-core
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
