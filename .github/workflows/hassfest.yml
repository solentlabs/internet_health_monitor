name: Validate with hassfest

# HA's own integration validator (manifest, translations, services, brands
# metadata). Nightly as well, so a new HA release that tightens a rule shows
# up before users hit it. Same as Cable Modem Monitor.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    name: HA Integration Validation
    runs-on: ubuntu-latest
    # https://github.com/home-assistant/actions/tree/master/hassfest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
